<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#116149" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lopes Tur" />
  <link rel="manifest" href="manifest.webmanifest?v=12" />
  <link rel="icon" href="logo-lopes-tur.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo-lopes-tur.svg" />
  <title>Lopes Tur</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <style>
    .bottom-nav{overflow-x:auto;justify-content:flex-start}.bottom-nav button{width:auto;min-width:92px;flex:0 0 auto}.kmc-nav-button{border-left:1px solid rgba(240,209,138,.2)!important}
    .kmc-standalone{max-width:760px}.kmc-standalone[hidden]{display:none}.kmc-standalone textarea{min-height:125px}.kmc-standalone .metric strong{font-size:20px}
    #syncStatus{position:fixed;right:12px;bottom:78px;z-index:99999;padding:7px 11px;border-radius:999px;background:#116149;color:#fff;font:600 12px system-ui;box-shadow:0 3px 12px rgba(0,0,0,.15);opacity:.92;pointer-events:none}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><img class="brand-photo" src="lopes-tur-carro.png" alt="Carro Lopes Tur" /><div><span class="eyebrow">CONTROLE DO SEU CARRO</span><h1>Lopes Tur</h1></div></div><button class="icon-button" id="exportButton" title="Exportar dados">⇩</button></header>
  <main id="app" class="content"></main>
  <section id="kmc-view" class="content kmc-standalone" hidden></section>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-view="dashboard" class="active">⌂<span>Painel</span></button>
    <button data-view="income">＋<span>Ganhos</span></button>
    <button data-view="expense">−<span>Gastos</span></button>
    <button data-view="personal">👤<span>Pessoal</span></button>
    <button data-view="reports">▥<span>Relatórios</span></button>
    <button data-view="settings">⚙<span>Ajustes</span></button>
    <button id="kmc-nav" class="kmc-nav-button">🧮<span>Calculadora KM</span></button>
  </nav>
  <div id="syncStatus">☁ Sincronização ativa</div>
  <div id="toast" role="status"></div>
  <script src="categorias-fix.js?v=2"></script>
  <script src="app.js?v=24"></script>
  <script src="ultimos-lancamentos-fix.js?v=4"></script>
  <script src="contas-carro.js?v=5"></script>
  <script src="calendario-carro.js?v=2"></script>
  <script src="lembretes-contas.js?v=4"></script>
  <script src="metas-diarias.js?v=5"></script>
  <script src="pessoal-fix.js?v=5"></script>
  <script src="pessoal-calendario.js?v=3"></script>
  <script src="relatorios-fix.js?v=3"></script>
  <script src="sincronizacao-v3.js?v=9"></script>
  <script src="calculadora-km.js?v=7"></script>
  <script>
    (function(){
      const app=document.getElementById('app'),kmView=document.getElementById('kmc-view'),nav=document.getElementById('kmc-nav');
      nav.onclick=function(){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));nav.classList.add('active');app.hidden=true;kmView.hidden=false;if(window.LopesTurCalculadoraKM)window.LopesTurCalculadoraKM.render();};
      document.querySelectorAll('.bottom-nav button[data-view]').forEach(b=>b.addEventListener('click',()=>{app.hidden=false;kmView.hidden=true;nav.classList.remove('active');}));
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=18').then(async reg => {
        if (Notification.permission === 'default') await Notification.requestPermission();
        if (reg.active) reg.active.postMessage({type:'CHECK_REMINDERS'});
      }).catch(()=>{});
    }
  </script>
</body>
</html>
