<!doctype html><meta charset="utf-8"><title>Teste Calculadora KM</title><script src="calculadora-km.js"></script><div id="kmc-view"></div><script>document.addEventListener('DOMContentLoaded',()=>{LopesTurCalculadoraKM.render();const s=document.getElementById('kmc-service');const kmOption=[...s.options].find(o=>o.value==='km');if(!kmOption)throw new Error('Deve existir a opção KM Rodado manual');for(const o of s.options){if(/^km:/.test(o.value))throw new Error('Não deve existir tarifa automática de KM');}s.value='km';const initial=document.getElementById('kmc-initial'), final=document.getElementById('kmc-final'), manual=document.getElementById('kmc-manual-km');if(!manual)throw new Error('Campo de KM manual não encontrado');if(initial&&!initial.hidden)throw new Error('KM inicial deveria ficar oculto no modo manual');if(final&&!final.hidden)throw new Error('KM final deveria ficar oculto no modo manual');manual.value='125';document.getElementById('kmc-hours').value=1;document.getElementById('kmc-toll').value=20;document.getElementById('kmc-parking').value=10;document.getElementById('kmc-client').value='Teste';document.getElementById('kmc-calc').click();const km=document.getElementById('kmc-km').textContent;if(km!=='125 km')throw new Error('KM manual inesperado: '+km);const total=document.getElementById('kmc-total').textContent;if(total!=='R$ 120,00')throw new Error('Total inesperado: '+total);document.body.insertAdjacentHTML('beforeend','<p id="ok">PASSOU</p>');});</script>
