<!doctype html><meta charset="utf-8"><title>Teste Calculadora KM</title><script src="calculadora-km.js"></script><div id="kmc-view"></div><script>document.addEventListener('DOMContentLoaded',()=>{LopesTurCalculadoraKM.render();const s=document.getElementById('kmc-service');if(![...s.options].some(o=>o.value==='manual'))throw new Error('Deve existir a opção KM Rodado manual');s.value='manual';const km=document.getElementById('kmc-manual-km');const rate=document.getElementById('kmc-km-rate');if(!rate)throw new Error('Deve existir o campo Valor por KM');km.value='100';rate.value='1,50';document.getElementById('kmc-calc').click();if(document.getElementById('kmc-km').textContent!=='100 km')throw new Error('100 deveria aparecer como 100 km');if(document.getElementById('kmc-km-value').textContent!=='R$ 150,00')throw new Error('100 km a R$ 1,50/km deveria dar R$ 150,00');if(document.getElementById('kmc-total').textContent!=='R$ 150,00')throw new Error('Total deveria ser R$ 150,00');km.value='150,75';rate.value='1,50';document.getElementById('kmc-calc').click();if(document.getElementById('kmc-km-value').textContent!=='R$ 226,13')throw new Error('150,75 km a R$ 1,50/km deveria dar R$ 226,13');document.body.insertAdjacentHTML('beforeend','<p id="ok">PASSOU</p>');});</script>
