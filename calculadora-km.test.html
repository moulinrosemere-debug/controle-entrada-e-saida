<!doctype html><meta charset="utf-8"><title>Teste Calculadora KM</title><script src="calculadora-km.js"></script><div id="kmc-view"></div><script>document.addEventListener('DOMContentLoaded',()=>{LopesTurCalculadoraKM.render();const s=document.getElementById('kmc-service');if(![...s.options].some(o=>o.value==='manual'))throw new Error('Deve existir a opção KM Rodado manual');s.value='manual';const manual=document.getElementById('kmc-manual-km');manual.value='1,50';document.getElementById('kmc-calc').click();if(document.getElementById('kmc-km').textContent!=='1,5 km')throw new Error('1,50 deveria ser 1,5 km');manual.value='150,75';document.getElementById('kmc-calc').click();if(document.getElementById('kmc-km').textContent!=='150,75 km')throw new Error('150,75 deveria ser 150,75 km');document.body.insertAdjacentHTML('beforeend','<p id="ok">PASSOU</p>');});</script>
