<!doctype html><meta charset="utf-8"><title>Teste Calculadora KM</title><script src="calculadora-km.js?v=6"></script><div id="kmc-view"></div><script>document.addEventListener('DOMContentLoaded',()=>{LopesTurCalculadoraKM.render();const s=document.getElementById('kmc-service');s.value='manual';const km=document.getElementById('kmc-manual-km'),rate=document.getElementById('kmc-km-rate');km.value='100';rate.value='1,50';document.getElementById('kmc-calc').click();if(document.getElementById('kmc-km-value').textContent!=='R$ 150,00')throw new Error('100 km x R$ 1,50 deveria ser R$ 150,00');if(document.getElementById('kmc-total').textContent!=='R$ 150,00')throw new Error('Total deveria ser R$ 150,00');const waitRate=document.getElementById('kmc-wait-rate');if(!waitRate||waitRate.options.length<2)throw new Error('Deveria haver duas opções de espera: R$ 80,00/h e R$ 90,00/h');waitRate.value='80';if(Number(waitRate.value)!==80)throw new Error('A opção diurna deveria ser R$ 80,00/h');waitRate.value='90';if(Number(waitRate.value)!==90)throw new Error('A opção noturna deveria ser R$ 90,00/h');if(!document.getElementById('kmc-wait-start')||!document.getElementById('kmc-wait-stop'))throw new Error('Deveria existir cronômetro para iniciar e finalizar a espera');document.body.insertAdjacentHTML('beforeend','<p id="ok">PASSOU</p>');});</script>
